<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VP Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f0efeb;
  --border:#e8e8e4;
  --border-strong:#d8d7d2;
  --text:#1a1a1a;
  --text-dim:#525252;
  --text-faint:#666666;
  --topbar-bg:#ffffff;
  --blue:#3B82F6;      --blue-bg:rgba(59,130,246,0.14);
  --green:#22C55E;     --green-bg:rgba(34,197,94,0.14);
  --amber:#F59E0B;     --amber-bg:rgba(245,158,11,0.14);
  --rose:#FB7185;      --rose-bg:rgba(251,113,133,0.14);
  --slate:#7C8797;     --slate-bg:rgba(124,135,151,0.14);
  --crestone:#d97706;    --crestone-bg:rgba(217,119,6,0.14);
  --sadierose:#e11d48;   --sadierose-bg:rgba(225,29,72,0.14);
  --talitha:#3b82f6;     --talitha-bg:rgba(59,130,246,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
.app{max-width:1280px;margin:0 auto;padding:0 1.5rem 4rem;}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--topbar-bg);border-bottom:1px solid var(--border);padding:14px 0;}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.logo{font-size:14px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);}
.gauge-wrap{flex:1;min-width:240px;max-width:460px;}
.gauge-bar{height:8px;border-radius:5px;background:var(--surface2);display:flex;overflow:hidden;position:relative;}
.gauge-seg{height:100%;transition:width .3s;}
.gauge-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-dim);}
.gauge-labels{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
.gauge-label{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
.gauge-label b{color:var(--text);font-weight:700;}
.gauge-label .flag{color:var(--amber);}
.gauge-empty{font-size:11px;color:var(--text-faint);}

/* ===== Bookmarks ===== */
.bookmarks{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--border);}
.bm-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 12px;font-size:12px;color:var(--text-dim);text-decoration:none;cursor:pointer;position:relative;}
.bm-chip:hover{border-color:var(--border-strong);color:var(--text);}
.bm-chip .bm-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;margin-left:2px;opacity:0;}
.bm-chip:hover .bm-del{opacity:1;}
.bm-chip .bm-del:hover{color:var(--rose);}
.bm-add-btn{background:transparent;border:1px dashed var(--border-strong);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.bm-add-btn:hover{color:var(--text);border-color:var(--blue);}
.bm-form{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:6px;}
.bm-form input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--text);width:110px;}
.bm-form input:focus{outline:none;border-color:var(--blue);}
.bm-form button{background:var(--blue);border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;}
.bm-form .cancel{background:none;color:var(--text-dim);}

/* ===== Nav tabs ===== */
.tabs{display:flex;gap:4px;padding:14px 0 0;border-bottom:1px solid var(--border);}
.tab{background:none;border:none;color:var(--text-dim);font-size:15px;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--blue);}
.tab-badge{background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:16px;text-align:center;}

main{padding-top:34px;}

/* ===== Section headers ===== */
.view-title{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px;}
.view-sub{font-size:15px;font-weight:400;color:var(--text-dim);line-height:1.6;margin-bottom:28px;}

/* ===== KPI strip ===== */
.kpi-strip{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;}
.kpi-tile{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;}
.kpi-tile-label{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.kpi-tile-value{font-size:22px;font-weight:800;color:var(--text);outline:none;min-height:28px;line-height:1.3;}
.kpi-tile-value:empty::before{content:attr(data-ph);color:var(--text-faint);font-weight:400;font-size:15px;}
.kpi-tile-value:focus{background:var(--surface2);border-radius:6px;padding:2px 6px;margin:-2px -6px;}

/* ===== Streak / progress row ===== */
.focus-hud{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:26px;}
.streak-pill{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-dim);flex-shrink:0;}
.streak-flame{font-size:18px;display:inline-block;animation:flameFlicker 1.8s ease-in-out infinite;}
@keyframes flameFlicker{0%,100%{transform:scale(1) rotate(0deg);opacity:1;}25%{transform:scale(1.06) rotate(-3deg);opacity:.9;}50%{transform:scale(.96) rotate(2deg);opacity:1;}75%{transform:scale(1.03) rotate(-1deg);opacity:.94;}}
.streak-num{font-size:19px;font-weight:800;color:var(--amber);}
.streak-num.roll-anim{display:inline-block;animation:rollUp .45s cubic-bezier(.34,1.56,.64,1);}
@keyframes rollUp{0%{transform:translateY(55%);opacity:0;}60%{transform:translateY(-6%);opacity:1;}100%{transform:translateY(0);opacity:1;}}
.streak-pill.celebrate{animation:streakCelebrate .8s ease;}
@keyframes streakCelebrate{0%{transform:scale(1);}30%{transform:scale(1.12);}100%{transform:scale(1);}}
.progress-wrap{flex:1;min-width:180px;}
.progress-label{font-size:11.5px;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between;}
.progress-label .done-num.roll-anim{display:inline-block;animation:rollUp .45s cubic-bezier(.34,1.56,.64,1);}
.progress-track{position:relative;height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;}
.progress-track.pulse-50{animation:pulseGlow50 .9s ease;}
@keyframes pulseGlow50{0%{box-shadow:0 0 0 0 rgba(234,179,8,0);}40%{box-shadow:0 0 14px 3px rgba(234,179,8,.55);}100%{box-shadow:0 0 0 0 rgba(234,179,8,0);}}
.progress-track.complete{box-shadow:0 0 14px rgba(234,179,8,.5);}
.progress-track.flash-once{animation:flashGold100 .8s ease;}
@keyframes flashGold100{0%{filter:brightness(1);}30%{filter:brightness(1.6);}100%{filter:brightness(1);}}
.progress-fill{position:relative;height:100%;background:linear-gradient(90deg,var(--green),#eab308);border-radius:5px;transition:width .4s ease;overflow:hidden;}
.progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 45%,rgba(255,255,255,.4) 55%,transparent 70%);background-size:200% 100%;animation:shimmerSweep 2.6s linear infinite;}
@keyframes shimmerSweep{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ===== Filters ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;}
.filter-btn:hover{color:var(--text);border-color:var(--border-strong);}
.filter-btn.active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}

/* ===== Task card ===== */
.task-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent,var(--border));border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:box-shadow .2s;}
.task-card:last-child{margin-bottom:0;}
.task-card.delegated{opacity:.58;}
.task-card.dragging{opacity:.35;}
.task-top{display:flex;align-items:flex-start;gap:12px;}
.drag-handle{color:var(--text-faint);font-size:14px;cursor:grab;padding-top:3px;flex-shrink:0;user-select:none;}
.task-check{width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:6px;flex-shrink:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-top:3px;}
.task-check.done{background:var(--green);border-color:var(--green);animation:checkPop .28s ease;}
@keyframes checkPop{0%{transform:scale(.6);}60%{transform:scale(1.18);}100%{transform:scale(1);}}
.check-path{stroke-dasharray:26;stroke-dashoffset:0;}
.check-path-animate{stroke-dashoffset:26;animation:drawCheck .35s cubic-bezier(.65,0,.35,1) forwards;}
@keyframes drawCheck{to{stroke-dashoffset:0;}}
.task-card.breathing{animation:cardBreathe .42s ease-out;}
@keyframes cardBreathe{0%{transform:scale(1);}35%{transform:scale(1.025);}100%{transform:scale(1);}}
.particle{position:fixed;width:5px;height:5px;border-radius:50%;background:#eab308;pointer-events:none;z-index:500;animation:particleBurst .6s cubic-bezier(.25,.8,.4,1) forwards;}
@keyframes particleBurst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;}}
.task-main{flex:1;min-width:0;}
.task-brand{display:block;background:none;border:none;padding:0;margin-bottom:7px;font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);cursor:pointer;font-family:inherit;}
.task-brand:hover{opacity:.8;}
.task-title{flex:1;min-width:0;font-size:16px;font-weight:500;color:var(--text);line-height:1.6;outline:none;word-break:break-word;}
.task-title:focus{background:var(--surface2);border-radius:5px;padding:2px 5px;margin:-2px -5px;}
.task-card.status-done .task-title{text-decoration:line-through;color:var(--text-faint);}
.task-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;padding:2px;flex-shrink:0;opacity:0;transition:opacity .12s;}
.task-card:hover .task-del{opacity:1;}
.task-del:hover{color:var(--rose);}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:none;cursor:pointer;font-family:inherit;}
.chip.brand-crestone{background:var(--crestone-bg);color:var(--crestone);}
.chip.brand-sadierose{background:var(--sadierose-bg);color:var(--sadierose);}
.chip.brand-talitha{background:var(--talitha-bg);color:var(--talitha);}
.chip.impact-high{background:var(--amber-bg);color:var(--amber);}
.chip.impact-medium{background:var(--blue-bg);color:var(--blue);}
.chip.impact-low{background:var(--slate-bg);color:var(--slate);}
.meta-due{border:none;background:transparent;font-size:11px;color:var(--text-faint);font-family:inherit;cursor:pointer;width:22px;}
.meta-due.has-value{width:74px;color:var(--text-dim);}
.meta-due.overdue{color:var(--rose);font-weight:700;}
.owner-sel{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:11px;color:var(--text-dim);cursor:pointer;}
.owner-name{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:11px;color:var(--text);width:80px;}
.owner-name::placeholder{color:var(--text-faint);}
.waiting-toggle{background:transparent;border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:10.5px;color:var(--text-faint);cursor:pointer;font-weight:600;}
.waiting-toggle.active{background:rgba(245,158,11,.12);border-color:var(--amber);color:var(--amber);}
.drop-indicator{height:2px;background:var(--blue);border-radius:2px;margin:2px 0;}

/* ===== Add row ===== */
.add-row{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.add-row select, .add-row input[type=text]{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12.5px;color:var(--text);}
.add-row input[type=text]{flex:1;min-width:140px;font-size:15px;font-weight:400;line-height:1.6;}
.add-row input::placeholder{color:var(--text-faint);}
.add-row select:focus,.add-row input:focus{outline:none;border-color:var(--blue);}
.imp-quick{display:flex;gap:3px;}
.imp-btn{width:26px;height:30px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;font-size:11px;font-weight:700;color:var(--text-dim);cursor:pointer;}
.imp-btn.active[data-i="high"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
.imp-btn.active[data-i="medium"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
.imp-btn.active[data-i="low"]{background:var(--slate-bg);border-color:var(--slate);color:var(--slate);}
.add-btn{background:var(--blue);border:none;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;}
.add-btn:hover{background:#2f6fdb;}

.empty-note{padding:20px;font-size:15px;font-weight:400;line-height:1.6;color:var(--text-faint);font-style:italic;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:10px;}
.completed-toggle{font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;padding:10px 4px;user-select:none;}
.completed-toggle:hover{color:var(--text);}

/* ===== Projects view ===== */
.brand-group{margin-bottom:36px;}
.brand-group:last-child{margin-bottom:0;}
.brand-group-hd{display:flex;align-items:center;gap:14px;border-left:5px solid var(--accent);border-radius:12px;background:var(--surface);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;}
.brand-group-hd:hover{background:var(--surface2);}
.brand-group-chevron{color:var(--text-faint);font-size:12px;transition:transform .15s;flex-shrink:0;}
.brand-group.open .brand-group-chevron{transform:rotate(90deg);}
.brand-group-title{flex:1;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.brand-group-count{font-size:12px;color:var(--text-dim);font-weight:600;flex-shrink:0;}
.brand-group-new{background:none;border:1px dashed var(--border-strong);border-radius:7px;padding:6px 14px;font-size:12px;color:var(--text-dim);cursor:pointer;flex-shrink:0;font-family:inherit;}
.brand-group-new:hover{color:var(--text);border-color:var(--blue);}
.brand-group-body{display:none;padding-top:20px;}
.brand-group.open .brand-group-body{display:block;}
.brand-group.weight-lg .brand-group-hd{padding:26px 30px;}
.brand-group.weight-lg .brand-group-title{font-size:32px;}
.brand-group.weight-md .brand-group-hd{padding:18px 22px;}
.brand-group.weight-md .brand-group-title{font-size:26px;}
.brand-group.weight-sm .brand-group-hd{padding:13px 18px;}
.brand-group.weight-sm .brand-group-title{font-size:22px;}
.proj-new-form{display:flex;gap:6px;margin-bottom:16px;}
.proj-new-form input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:15px;font-weight:400;line-height:1.6;color:var(--text);}
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.proj-card:last-child{margin-bottom:0;}
.proj-hd{display:flex;align-items:center;gap:10px;padding:16px 18px;cursor:pointer;border-left:3px solid var(--accent);}
.proj-hd:hover{background:var(--surface2);}
.proj-chevron{font-size:10px;color:var(--text-faint);transition:transform .15s;flex-shrink:0;}
.proj-card.open .proj-chevron{transform:rotate(90deg);}
.proj-name{flex:1;font-size:16px;font-weight:700;line-height:1.6;outline:none;min-width:0;}
.proj-name:focus{background:var(--surface2);border-radius:5px;padding:2px 5px;margin:-2px -5px;}
.proj-progress{font-size:11px;color:var(--text-dim);flex-shrink:0;white-space:nowrap;}
.proj-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;flex-shrink:0;}
.proj-del:hover{color:var(--rose);}
.proj-body{display:none;padding:10px 18px 20px;border-top:1px solid var(--border);}
.proj-card.open .proj-body{display:block;padding-top:16px;}

/* ===== Weekly view ===== */
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
@media (max-width:900px){.week-grid{grid-template-columns:1fr;}}
.week-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;min-height:120px;}
.week-col.overloaded{border-color:var(--amber);}
.week-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.week-day{font-size:13px;font-weight:700;}
.week-date{font-size:11px;color:var(--text-faint);}
.week-count{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--surface2);color:var(--text-dim);}
.week-count.hot{background:var(--amber-bg);color:var(--amber);}
.week-empty{font-size:11.5px;color:var(--text-faint);font-style:italic;padding:8px 0;}

/* ===== Wins ===== */
.win-form{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:20px;}
.win-form input,.win-form select{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12.5px;color:var(--text);}
.win-form input[type=text]{flex:1;min-width:200px;font-size:15px;font-weight:400;line-height:1.6;}
.win-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;}
.win-trophy{font-size:20px;flex-shrink:0;}
.win-body{flex:1;min-width:0;}
.win-desc{font-size:16px;font-weight:600;line-height:1.6;color:var(--text);}
.win-meta{display:flex;gap:8px;align-items:center;margin-top:6px;}
.win-date{font-size:11px;color:var(--text-faint);}
.win-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;opacity:0;}
.win-card:hover .win-del{opacity:1;}
.win-del:hover{color:var(--rose);}

/* ===== Capture ===== */
.capture-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
.capture-label{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.capture-input-row{display:flex;gap:8px;}
.capture-input-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:15px;font-weight:400;line-height:1.6;color:var(--text);}
.capture-input-row input:focus{outline:none;border-color:var(--blue);}
.mic-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);cursor:pointer;font-size:15px;flex-shrink:0;}
.mic-btn.recording{background:var(--rose-bg);border-color:var(--rose);color:var(--rose);animation:micPulse 1.2s infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.5);}50%{box-shadow:0 0 0 8px rgba(251,113,133,0);}}
.mic-btn:disabled{opacity:.4;cursor:not-allowed;}
.voice-live{margin-top:10px;font-size:12.5px;color:var(--text-dim);font-style:italic;min-height:18px;}
.voice-review{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.voice-review-title{font-size:11.5px;color:var(--text-dim);margin-bottom:8px;}
.voice-line{display:flex;gap:8px;margin-bottom:6px;}
.voice-line input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:15px;font-weight:400;line-height:1.6;color:var(--text);}
.voice-line button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;}
.voice-actions{display:flex;gap:8px;margin-top:8px;}

.toast.win-flavor{border-color:var(--amber);}

@media (max-width:640px){

</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="logo-dot"></span>VP COMMAND CENTER</div>
    <div class="gauge-wrap" id="gauge-wrap"></div>
  </div>
</div>

<div class="app">
  <div class="bookmarks" id="bookmarks"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view-root"></main>
</div>

<div class="toast" id="toast">
  <span id="toast-msg"></span>
  <button id="toast-action" style="display:none"></button>
</div>

<script>
/* ============ CONSTANTS ============ */
const STORE_KEY = 'vp_command_center_v1';
const BRAND_ORDER = ['crestone','sadierose','talitha'];
const BRANDS = {
  crestone:   { label:'Crestone',      color:'var(--crestone)', target:80 },
  sadierose:  { label:'Sadie Rose',    color:'var(--sadierose)', target:10 },
  talitha:    { label:'Talitha Coffee',color:'var(--talitha)', target:10 },
};
const BRAND_WEIGHT_CLASS = { crestone:'weight-lg', sadierose:'weight-md', talitha:'weight-sm' };
const IMPACT_LABEL = { high:'High', medium:'Medium', low:'Low' };
const IMPACT_CYCLE = ['high','medium','low'];
const OVERLOAD_THRESHOLD = 4;
const OFF_TARGET_THRESHOLD = 15;

const GENERIC_MESSAGES = ["Nice work.", "One down.", "Keep the momentum.", "That's progress.", "You're moving.", "Clean execution."];
const HIGH_IMPACT_MESSAGES = ["That's a revenue mover.", "{brand} is winning today.", "Big one — nice work.", "That moves the needle.", "You're on a roll."];
const CHECK_SVG = '<svg class="check-svg" viewBox="0 0 24 24" width="13" height="13"><path class="check-path" d="M4 12.5L9.5 18L20 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const TABS = [
  { key:'focus',    label:'Focus' },
  { key:'projects', label:'Projects' },
  { key:'weekly',   label:'Weekly' },
  { key:'wins',     label:'Wins' },
  { key:'capture',  label:'Capture' },
];

/* ============ STATE ============ */
function defaultKpis(){
  return [
    { key:'pipeline', label:'Pipeline', value:'' },
    { key:'revenue',  label:'Revenue',  value:'' },
    { key:'calls',    label:'Calls',    value:'' },
  ];
}
function defaultState(){
  return {
    tasks: [],
    projects: [],
    wins: [],
    inbox: [],
    bookmarks: [],
    kpis: defaultKpis(),
    dailyFocus: null,
    streak: { count:0, lastCompletedDate:null },
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const d = JSON.parse(raw);
    const merged = Object.assign(defaultState(), d);
    if(!Array.isArray(merged.kpis)) merged.kpis = defaultKpis();
    return merged;
  }catch{ return defaultState(); }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = load();
let activeView = 'focus';
let activeFilter = 'all';
let openProjectIds = new Set();
let collapsedBrandGroups = new Set();
let showCompletedFor = new Set(); // project ids with completed section expanded
let pendingImpactByContext = {}; // key -> 'high'|'medium'|'low'
let pendingBrandFocusAdd = 'crestone';
let addingBookmark = false;
let promotingInboxId = null;
let lastDeleted = null; // {kind, payload}
let toastTimer = null;
let dragTaskId = null;
let dragOverId = null;
let recognizing = false;
let recognition = null;
let voiceBuffer = '';
let voiceReviewLines = null;
let pendingCompletions = new Set();
let showFocusCompleted = false;
let lastDoneCountShown = null;
let lastStreakShown = null;
let pulsedAt50 = false;
let celebrated100 = false;

/* ============ HELPERS ============ */
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10?'0'+n:''+n; }
function dateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return dateStr(new Date()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dateStr(d); }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${M[parseInt(p[1])-1]} ${parseInt(p[2])}`; }
function parseLocalDate(str){ const p=str.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function isOverdue(dueDate, status){ if(!dueDate||status==='done') return false; const t=new Date(); t.setHours(0,0,0,0); return parseLocalDate(dueDate) < t; }
function brandLabel(b){ return BRANDS[b]?BRANDS[b].label:b; }
function rankCompare(a,b){
  const iv={high:3,medium:2,low:1};
  if(iv[b.impact]!==iv[a.impact]) return iv[b.impact]-iv[a.impact];
  const ad=a.dueDate?parseLocalDate(a.dueDate).getTime():Infinity;
  const bd=b.dueDate?parseLocalDate(b.dueDate).getTime():Infinity;
  if(ad!==bd) return ad-bd;
  return a.createdAt-b.createdAt;
}
function getTask(id){ return state.tasks.find(t=>t.id===id); }
/* Any new open task should show up on Focus today, not just wait for tomorrow's
   rollover — the Focus, Projects, and Weekly views all read the same
   state.tasks array, but Focus additionally needs the id registered here. */
function addToDailyFocus(taskId){
  if(!state.dailyFocus) return;
  if(!state.dailyFocus.taskIds.includes(taskId)) state.dailyFocus.taskIds.push(taskId);
}

/* Focus view priority: Crestone tasks first, then Sadie Rose, then Talitha
   (reflecting the 70/20/10 time split); impact and due date break ties within
   a brand. Manual drag order overrides this once the daily list is built. */
function focusRankCompare(a,b){
  const bi = BRAND_ORDER.indexOf(a.brand) - BRAND_ORDER.indexOf(b.brand);
  if(bi!==0) return bi;
  const iv={high:3,medium:2,low:1};
  if(iv[b.impact]!==iv[a.impact]) return iv[b.impact]-iv[a.impact];
  const ad=a.dueDate?parseLocalDate(a.dueDate).getTime():Infinity;
  const bd=b.dueDate?parseLocalDate(b.dueDate).getTime():Infinity;
  if(ad!==bd) return ad-bd;
  return a.createdAt-b.createdAt;
}

/* ============ DAILY FOCUS / STREAK ============ */
function ensureDailyFocus(){
  const today = todayStr();
  if(!state.dailyFocus || state.dailyFocus.date !== today){
    const y = yesterdayStr();
    if(state.streak.lastCompletedDate && state.streak.lastCompletedDate !== y && state.streak.lastCompletedDate !== today){
      state.streak.count = 0;
    }
    pulsedAt50 = false;
    celebrated100 = false;
    const candidates = state.tasks.filter(t=>t.status!=='done').sort(focusRankCompare).slice(0,5).map(t=>t.id);
    state.dailyFocus = { date: today, taskIds: candidates };
    save();
  }
}
/* Streak increments once per calendar day the first time any task is
   completed — not tied to finishing the full top 5. Returns the new streak
   count if it just incremented, or null if today was already counted. */
function checkStreak(){
  const today = todayStr();
  if(state.streak.lastCompletedDate === today) return null;
  const y = yesterdayStr();
  state.streak.count = (state.streak.lastCompletedDate === y) ? state.streak.count + 1 : 1;
  state.streak.lastCompletedDate = today;
  save();
  return state.streak.count;
}

/* ============ RENDER DISPATCH ============ */
function render(){
  ensureDailyFocus();
  renderGauge();
  renderBookmarks();
  renderTabs();
  const root = document.getElementById('view-root');
  if(activeView==='focus') root.innerHTML = focusViewHtml();
  else if(activeView==='projects') root.innerHTML = projectsViewHtml();
  else if(activeView==='weekly') root.innerHTML = weeklyViewHtml();
  else if(activeView==='wins') root.innerHTML = winsViewHtml();
  else if(activeView==='capture') root.innerHTML = captureViewHtml();
}

function setView(v){ activeView=v; render(); }

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(t=>{
    const badge = t.key==='capture' && state.inbox.length ? `<span class="tab-badge">${state.inbox.length}</span>` : '';
    return `<button class="tab${activeView===t.key?' active':''}" onclick="setView('${t.key}')">${t.label}${badge}</button>`;
  }).join('');
}

/* ============ GAUGE ============ */
function renderGauge(){
  const el = document.getElementById('gauge-wrap');
  const open = state.tasks.filter(t=>t.status!=='done');
  const total = open.length;
  if(!total){ el.innerHTML = `<div class="gauge-empty">Time allocation gauge — add open tasks to see distribution</div>`; return; }
  const counts = {crestone:0,sadierose:0,talitha:0};
  open.forEach(t=>{ if(counts[t.brand]!==undefined) counts[t.brand]++; });
  const pct = {}; BRAND_ORDER.forEach(b=> pct[b] = Math.round(counts[b]/total*100));
  let cum = 0;
  const ticks = BRAND_ORDER.map(b=>{ cum += BRANDS[b].target; return cum; }).slice(0,-1);
  const segs = BRAND_ORDER.map(b=>`<div class="gauge-seg" style="width:${pct[b]}%;background:${BRANDS[b].color}"></div>`).join('');
  const tickHtml = ticks.map(t=>`<div class="gauge-tick" style="left:${t}%"></div>`).join('');
  const labels = BRAND_ORDER.map(b=>{
    const diff = pct[b]-BRANDS[b].target;
    const flag = Math.abs(diff) > OFF_TARGET_THRESHOLD ? `<span class="flag">⚠</span>` : '';
    return `<span class="gauge-label">${flag}${BRANDS[b].label}: <b>${pct[b]}%</b> (target ${BRANDS[b].target}%)</span>`;
  }).join('');
  el.innerHTML = `<div class="gauge-bar">${segs}${tickHtml}</div><div class="gauge-labels">${labels}</div>`;
}

/* ============ BOOKMARKS ============ */
function renderBookmarks(){
  const el = document.getElementById('bookmarks');
  let html = state.bookmarks.map(b=>`
    <a class="bm-chip" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label)}<button class="bm-del" onclick="event.preventDefault();event.stopPropagation();delBookmark('${b.id}')">✕</button></a>
  `).join('');
  if(addingBookmark){
    html += `<div class="bm-form">
      <input type="text" id="bm-label" placeholder="Label" maxlength="24">
      <input type="text" id="bm-url" placeholder="https://...">
      <button onclick="confirmAddBookmark()">Add</button>
      <button class="cancel" onclick="addingBookmark=false;render();">Cancel</button>
    </div>`;
  } else if(state.bookmarks.length < 10){
    html += `<button class="bm-add-btn" onclick="addingBookmark=true;render();setTimeout(()=>document.getElementById('bm-label')?.focus(),30);">+ Add link</button>`;
  }
  el.innerHTML = html;
}
function confirmAddBookmark(){
  const label = document.getElementById('bm-label').value.trim();
  let url = document.getElementById('bm-url').value.trim();
  if(!label || !url) return;
  if(!/^https?:\/\//i.test(url)) url = 'https://'+url;
  state.bookmarks.push({ id:uid(), label, url });
  addingBookmark = false;
  save(); render();
}
function delBookmark(id){ state.bookmarks = state.bookmarks.filter(b=>b.id!==id); save(); render(); }

/* ============ TASK CARD (shared) ============ */
function taskCardHtml(t, opts){
  opts = opts || {};
  const overdue = isOverdue(t.dueDate, t.status);
  const delegated = t.owner === 'delegated';
  return `<div class="task-card status-${t.status}${delegated?' delegated':''}" id="task-${t.id}" style="--accent:${BRANDS[t.brand].color}" ${opts.draggable?`draggable="true" ondragstart="taskDragStart(event,'${t.id}')" ondragover="taskDragOver(event,'${t.id}')" ondrop="taskDrop(event,'${t.id}')" ondragleave="taskDragLeave(event)"`:''}>
    <div class="task-top">
      ${opts.draggable?`<div class="drag-handle">⋮⋮</div>`:''}
      <button class="task-check${t.status==='done'?' done':''}" onclick="toggleDone('${t.id}')" title="Mark done">${t.status==='done'?CHECK_SVG:''}</button>
      <div class="task-main">
        <button class="task-brand" onclick="cycleBrand('${t.id}')" title="Click to change brand">${BRANDS[t.brand].label}</button>
        <span class="task-title" contenteditable="true" spellcheck="false" onblur="saveTitle('${t.id}',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${esc(t.title)}</span>
        <div class="task-meta">
          <button class="chip impact-${t.impact}" onclick="cycleImpact('${t.id}')" title="Click to change revenue impact">${IMPACT_LABEL[t.impact]}</button>
          <input type="date" class="meta-due${t.dueDate?' has-value':''}${overdue?' overdue':''}" value="${t.dueDate||''}" onchange="setDue('${t.id}',this.value)" title="Due date">
          <select class="owner-sel" onchange="setOwnerType('${t.id}',this.value)">
            <option value="me" ${t.owner==='me'?'selected':''}>Me</option>
            <option value="delegated" ${t.owner==='delegated'?'selected':''}>Delegated</option>
          </select>
          ${delegated?`<input type="text" class="owner-name" placeholder="Name" value="${esc(t.ownerName||'')}" onblur="setOwnerName('${t.id}',this.value)">`:''}
          ${t.status!=='done'?`<button class="waiting-toggle${t.status==='waiting'?' active':''}" onclick="toggleWaiting('${t.id}')">⏳ Waiting</button>`:''}
        </div>
      </div>
      <button class="task-del" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
    </div>
  </div>`;
}

/* ============ TASK ACTIONS ============ */
/* Completion is choreographed in three beats before the state actually
   commits: the checkbox draws its check and the card "breathes," a small
   particle burst fires, then the card physically collapses out of the list.
   Only once that's finished do we flip the task to done and re-render —
   otherwise render() would rebuild the DOM instantly and there'd be nothing
   left to animate. */
function toggleDone(id){
  const t = getTask(id); if(!t) return;
  if(t.status==='done'){
    t.status='open'; t.completedAt=null;
    save(); render();
    return;
  }
  if(pendingCompletions.has(id)) return;
  const card = document.getElementById('task-'+id);
  if(!card){ commitCompletion(id); return; }
  pendingCompletions.add(id);
  const checkBtn = card.querySelector('.task-check');
  if(checkBtn){
    checkBtn.classList.add('done');
    checkBtn.style.pointerEvents = 'none';
    checkBtn.innerHTML = CHECK_SVG.replace('check-path','check-path check-path-animate');
  }
  spawnParticles(checkBtn || card);
  card.classList.add('breathing');
  setTimeout(()=>{
    card.classList.remove('breathing');
    collapseAndRemove(card, ()=>{
      pendingCompletions.delete(id);
      commitCompletion(id);
    });
  }, 420);
}
function commitCompletion(id){
  const t = getTask(id); if(!t) return;
  t.status='done';
  t.completedAt=Date.now();
  save();
  const newStreak = checkStreak();
  render();
  let msg = t.impact==='high'
    ? HIGH_IMPACT_MESSAGES[Math.floor(Math.random()*HIGH_IMPACT_MESSAGES.length)].replace('{brand}', BRANDS[t.brand].label)
    : GENERIC_MESSAGES[Math.floor(Math.random()*GENERIC_MESSAGES.length)];
  if(newStreak) msg = `🔥 ${newStreak}-day streak! ${msg}`;
  if(t.impact==='high'){
    showToast(msg, 'win-prompt', { label:'Log as win', taskId:id });
  } else {
    showToast(msg, newStreak ? 'streak' : undefined);
  }
}
function collapseAndRemove(el, cb){
  const h = el.scrollHeight;
  const cs = getComputedStyle(el);
  el.style.maxHeight = h+'px';
  el.style.overflow = 'hidden';
  el.style.marginBottom = cs.marginBottom;
  void el.offsetHeight;
  el.style.transition = 'max-height .38s ease, opacity .38s ease, margin-bottom .38s ease, padding .38s ease, transform .38s ease';
  requestAnimationFrame(()=>{
    el.style.maxHeight = '0px';
    el.style.opacity = '0';
    el.style.marginBottom = '0px';
    el.style.paddingTop = '0px';
    el.style.paddingBottom = '0px';
    el.style.transform = 'scale(0.92)';
  });
  setTimeout(cb, 400);
}
function spawnParticles(originEl){
  if(!originEl) return;
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#eab308','#f4d03f','#d97706'];
  for(let i=0;i<7;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI*2*i/7) + (Math.random()*0.6-0.3);
    const dist = 16 + Math.random()*14;
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 650);
  }
}
function cycleBrand(id){ const t=getTask(id); if(!t) return; t.brand = BRAND_ORDER[(BRAND_ORDER.indexOf(t.brand)+1)%3]; save(); render(); }
function cycleImpact(id){ const t=getTask(id); if(!t) return; t.impact = IMPACT_CYCLE[(IMPACT_CYCLE.indexOf(t.impact)+1)%3]; save(); render(); }
function saveTitle(id, el){ const t=getTask(id); if(!t) return; const v=el.innerText.trim(); if(!v){ el.innerText=t.title; return; } t.title=v; save(); }
function setDue(id, val){ const t=getTask(id); if(!t) return; t.dueDate = val||null; save(); render(); }
function setOwnerType(id, val){ const t=getTask(id); if(!t) return; t.owner=val; if(val==='me') t.ownerName=''; save(); render(); }
function setOwnerName(id, val){ const t=getTask(id); if(!t) return; t.ownerName = val.trim(); save(); }
function toggleWaiting(id){ const t=getTask(id); if(!t||t.status==='done') return; t.status = t.status==='waiting' ? 'open' : 'waiting'; save(); render(); }

function deleteTask(id){
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const [removed] = state.tasks.splice(idx,1);
  if(state.dailyFocus) state.dailyFocus.taskIds = state.dailyFocus.taskIds.filter(x=>x!==id);
  lastDeleted = { kind:'task', payload:{ task:removed, idx } };
  save(); render();
  showToast(`Deleted "${removed.title}"`, 'undo');
}

/* ============ TOAST ============ */
function showToast(msg, flavor, action){
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.className = 'toast show' + (flavor==='win-prompt'?' win-flavor':flavor==='streak'?' streak-flavor':'');
  const btn = document.getElementById('toast-action');
  if(flavor==='undo'){
    btn.style.display='inline';
    btn.textContent='Undo';
    btn.onclick = undoLast;
  } else if(flavor==='win-prompt' && action){
    btn.style.display='inline';
    btn.textContent = action.label;
    btn.onclick = ()=>{ openWinPromptFor(action.taskId); toast.classList.remove('show'); };
  } else {
    btn.style.display='none';
    btn.onclick=null;
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toast.classList.remove('show'); if(flavor==='undo') lastDeleted=null; }, 5500);
}
function undoLast(){
  if(!lastDeleted) return;
  if(lastDeleted.kind==='task'){
    const { task, idx } = lastDeleted.payload;
    state.tasks.splice(Math.min(idx, state.tasks.length), 0, task);
  } else if(lastDeleted.kind==='project'){
    const { project, subtasks } = lastDeleted.payload;
    state.projects.push(project);
    subtasks.forEach(t=>state.tasks.push(t));
  } else if(lastDeleted.kind==='win'){
    state.wins.push(lastDeleted.payload.win);
  }
  lastDeleted = null;
  save(); render();
  document.getElementById('toast').classList.remove('show');
}
function openWinPromptFor(taskId){
  const t = getTask(taskId);
  if(!t) return;
  activeView = 'wins';
  render();
  setTimeout(()=>{
    const d = document.getElementById('win-desc'); if(d) d.value = t.title;
    const b = document.getElementById('win-brand'); if(b) b.value = t.brand;
    d && d.focus();
  }, 30);
}

/* ============ FOCUS VIEW ============ */
function focusFilterPredicate(t){
  if(activeFilter==='high') return t.impact==='high';
  if(activeFilter==='today') return t.dueDate===todayStr();
  if(activeFilter==='mine') return t.owner==='me';
  if(activeFilter==='waiting') return t.status==='waiting';

}

  const ids = state.dailyFocus.taskIds.filter(id=>getTask(id));

  const doneTasks = allTasks.filter(t=>t.status==='done');
  const doneCount = doneTasks.length;
  const total = allTasks.length;
  const pct = total ? Math.round(doneCount/total*100) : 0;
  const visible = openTasks.filter(focusFilterPredicate);

  const doneCountRolled = lastDoneCountShown!==null && doneCount>lastDoneCountShown;
  lastDoneCountShown = doneCount;

  const crossing50 = !pulsedAt50 && total>0 && pct>=50;

  const crossing100 = !celebrated100 && total>0 && pct>=100;

  const list = visible.length

  const completedSection = doneTasks.length ? `
    <div class="completed-toggle" onclick="toggleFocusCompleted()">${showFocusCompleted?'▼':'▶'} Completed today (${doneTasks.length})</div>
    ${showFocusCompleted ? doneTasks.map(t=>taskCardHtml(t)).join('') : ''}

    BRAND_ORDER.flatMap(b => state.projects.filter(p=>p.brand===b).map(p=>
      `<option value="${p.id}">[${BRANDS[b].label}] ${esc(p.name)}</option>`
    )).join('');
  const addForm = `<div class="add-row" style="margin-top:14px;">
    <select id="focus-add-brand">${BRAND_ORDER.map(b=>`<option value="${b}" ${pendingBrandFocusAdd===b?'selected':''}>${BRANDS[b].label}</option>`).join('')}</select>
    <div class="imp-quick" id="focus-imp-picker">
      ${['high','medium','low'].map(i=>`<button class="imp-btn${(pendingImpactByContext['focus']||'medium')===i?' active':''}" data-i="${i}" onclick="setPendingImpact('focus','${i}',this)">${i[0].toUpperCase()}</button>`).join('')}

/* drag reorder within dailyFocus.taskIds */
function taskDragStart(e, id){ dragTaskId = id; e.dataTransfer.effectAllowed='move'; setTimeout(()=>{ const el=document.getElementById('task-'+id); if(el) el.classList.add('dragging'); },0); }
function taskDragOver(e, overId){
  e.preventDefault();
  document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());
  if(!dragTaskId || dragTaskId===overId) return;
  const cardEl = document.getElementById('task-'+overId);
  if(!cardEl) return;
  const rect = cardEl.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height/2;
  const indicator = document.createElement('div');
  indicator.className='drop-indicator';
  indicator.dataset.target = overId;
  indicator.dataset.pos = before?'before':'after';
  cardEl.parentNode.insertBefore(indicator, before?cardEl:cardEl.nextSibling);
}
function taskDragLeave(){ }
function taskDrop(e, overId){
  e.preventDefault();
  document.querySelectorAll('.drop-indicator').forEach(el=>el.remove());
  document.querySelectorAll('.task-card').forEach(el=>el.classList.remove('dragging'));
  if(!dragTaskId || dragTaskId===overId || !state.dailyFocus){ dragTaskId=null; return; }
  const ids = state.dailyFocus.taskIds;
  const fromIdx = ids.indexOf(dragTaskId);
  if(fromIdx===-1){ dragTaskId=null; return; }
  ids.splice(fromIdx,1);
  const toIdx = ids.indexOf(overId);
  const insertAt = toIdx===-1 ? ids.length : toIdx;
  ids.splice(insertAt,0,dragTaskId);
  dragTaskId=null;
  save(); render();
}

function getWeekDates(){
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = day===0 ? -6 : 1-day;
  const monday = new Date(now); monday.setDate(now.getDate()+diffToMonday); monday.setHours(0,0,0,0);
  const days = [];
  for(let i=0;i<5;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); days.push(d); }
  return days;
}

  const days = getWeekDates();

/* --- Voice capture --- */
function toggleRecording(){
  if(!SPEECH_SUPPORTED) return;
  if(recognizing){ recognition && recognition.stop(); return; }
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new Ctor();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  voiceBuffer = '';
  recognition.onresult = (e)=>{
    let finalChunk='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) finalChunk += r[0].transcript + ' ';
      else interim += r[0].transcript;
    }
    if(finalChunk) voiceBuffer += finalChunk;
    const liveEl = document.getElementById('voice-live');
    if(liveEl) liveEl.textContent = (voiceBuffer + interim).trim() || 'Listening...';
  };
  recognition.onerror = ()=>{ recognizing=false; render(); };
  recognition.onend = ()=>{
    recognizing = false;
    const raw = voiceBuffer.trim();
    if(raw){
      voiceReviewLines = raw.split(/\bnext\b/i).map(s=>s.trim()).filter(Boolean);
      if(voiceReviewLines.length===0) voiceReviewLines = null;
    }
    render();
  };
  recognition.start();
  recognizing = true;
  render();
}

}

/* --- Mass upload parsing --- */
function matchBrand(s){
  const v=(s||'').toLowerCase();
  if(v.includes('crest')) return 'crestone';
  if(v.includes('sadie')||v.includes('rose')) return 'sadierose';
  if(v.includes('talitha')||v.includes('coffee')) return 'talitha';
  return undefined;
}
function matchImpact(s){
  const v=(s||'').toLowerCase();
  if(v.startsWith('h')) return 'high';
  if(v.startsWith('l')) return 'low';
  if(v.startsWith('m')) return 'medium';
  return undefined;
}
function matchDue(s){
  const v=(s||'').trim();
  if(!v || /^(none|tbd|-)$/i.test(v)) return undefined;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if(isNaN(d.getTime())) return undefined;
  if(!/\d{4}/.test(v)) d.setFullYear(new Date().getFullYear());
  return dateStr(d);
}
function matchOwner(s){
  const v=(s||'').trim();
  if(!v || /^me$/i.test(v)) return { owner:'me', ownerName:'' };
  return { owner:'delegated', ownerName:v };
}
function parseMassLine(line){
  const parts = line.split(/\s+[—–-]\s+/).map(p=>p.trim());
  if(!parts.length || !parts[0]) return null;
  const item = { id:uid(), text:parts[0], createdAt:Date.now() };
  if(parts[1]!==undefined){ const b=matchBrand(parts[1]); if(b) item.brand=b; }
  if(parts[2]!==undefined){ const i=matchImpact(parts[2]); if(i) item.impact=i; }
  if(parts[3]!==undefined){ const d=matchDue(parts[3]); if(d) item.dueDate=d; }
  if(parts[4]!==undefined){ const o=matchOwner(parts[4]); item.owner=o.owner; item.ownerName=o.ownerName; }
  return item;
}
function parseMassUpload(){
  const ta = document.getElementById('mass-textarea');
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  lines.forEach(line=>{ const item = parseMassLine(line); if(item) state.inbox.push(item); });
  ta.value='';
  save(); render();
  showToast(`Added ${lines.length} item(s) to inbox for review.`);
}

/* --- Inbox item + promote --- */
function inboxItemHtml(item){
  const tags = [];
  if(item.brand) tags.push(`<span class="chip brand-${item.brand}">${BRANDS[item.brand].label}</span>`);
  if(item.impact) tags.push(`<span class="chip impact-${item.impact}">${IMPACT_LABEL[item.impact]}</span>`);
  if(item.dueDate) tags.push(`<span class="chip" style="background:var(--surface2);color:var(--text-dim)">${fmtDate(item.dueDate)}</span>`);
  if(item.owner) tags.push(`<span class="chip" style="background:var(--surface2);color:var(--text-dim)">${item.owner==='me'?'Me':(item.ownerName||'Delegated')}</span>`);
  const isPromoting = promotingInboxId === item.id;
  return `<div class="inbox-item">
    <div class="inbox-top">
      <span class="inbox-text">${esc(item.text)}</span>
      <div class="inbox-actions">
        <button class="promote-btn" onclick="togglePromote('${item.id}')">${isPromoting?'Cancel':'Promote →'}</button>
        <button class="del-btn" onclick="deleteInboxItem('${item.id}')">Delete</button>
      </div>
    </div>
    ${tags.length?`<div class="inbox-tags">${tags.join('')}</div>`:''}
    ${isPromoting?promotePanelHtml(item):''}
  </div>`;
}
function promotePanelHtml(item){
  return `<div class="promote-panel">
    <select id="promote-brand-${item.id}">
      <option value="" disabled ${!item.brand?'selected':''}>Brand...</option>
      ${BRAND_ORDER.map(b=>`<option value="${b}" ${item.brand===b?'selected':''}>${BRANDS[b].label}</option>`).join('')}
    </select>
    <select id="promote-impact-${item.id}">
      ${['high','medium','low'].map(i=>`<option value="${i}" ${(item.impact||'medium')===i?'selected':''}>${IMPACT_LABEL[i]}</option>`).join('')}
    </select>
    <input type="date" id="promote-due-${item.id}" value="${item.dueDate||''}">
    <select id="promote-owner-${item.id}" onchange="document.getElementById('promote-ownername-${item.id}').style.display=this.value==='delegated'?'inline-block':'none'">
      <option value="me" ${(!item.owner||item.owner==='me')?'selected':''}>Me</option>
      <option value="delegated" ${item.owner==='delegated'?'selected':''}>Delegated</option>
    </select>
    <input type="text" id="promote-ownername-${item.id}" placeholder="Name" value="${esc(item.ownerName||'')}" style="display:${item.owner==='delegated'?'inline-block':'none'}">
    <button class="add-btn" onclick="confirmPromote('${item.id}')">Add task</button>
  </div>`;
}
function togglePromote(id){ promotingInboxId = promotingInboxId===id ? null : id; render(); }
function deleteInboxItem(id){ state.inbox = state.inbox.filter(i=>i.id!==id); save(); render(); }
function confirmPromote(id){
  const item = state.inbox.find(i=>i.id===id);
  if(!item) return;
  const brand = document.getElementById('promote-brand-'+id).value;
  if(!brand){ alert('Pick a brand before adding this task.'); return; }
  const impact = document.getElementById('promote-impact-'+id).value;
  const dueDate = document.getElementById('promote-due-'+id).value || null;
  const owner = document.getElementById('promote-owner-'+id).value;
  const ownerName = owner==='delegated' ? document.getElementById('promote-ownername-'+id).value.trim() : '';
  const t = { id:uid(), title:item.text, brand, impact, status:'open', owner, ownerName, dueDate, projectId:null, createdAt:Date.now(), completedAt:null };
  state.tasks.push(t);
  addToDailyFocus(t.id);
  state.inbox = state.inbox.filter(i=>i.id!==id);
  promotingInboxId = null;
  save(); render();
  showToast('Task added from inbox.');
}

/* ============ INIT ============ */
render();
</script>
</body>
</html>
